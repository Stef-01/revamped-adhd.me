name: Fetch app icons

# One-off: download the Learn page's app icons (scripts/fetch-app-icons.py) and commit them to this branch.
# The sandbox the site is built in cannot reach the App Store, so the runner does it.

on:
  push:
    branches: [claude/adhd-seo-service-pages-74iy4m]
    paths: ['scripts/fetch-app-icons.py', '.github/workflows/fetch-app-icons.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python3 scripts/fetch-app-icons.py || true
      - name: Commit the icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/learn/apps
          git diff --cached --quiet || (git commit -m "Add app icons for Learn (scripts/fetch-app-icons.py)" && git push)
