name: Site checks

# Every generated page and bundle is committed, so a pull request is checked for pages that are out of date with
# their builder, for CSS and JS bundles that are out of date with their sources, for the site's own rules
# (check-site.py), for valid HTML, and for broken internal links.
# build-sitemap.py --check is left to local runs: its <lastmod> dates come from commit dates, which differ on
# the merge commit a pull request is tested on.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generated pages are up to date
        run: npm run pages -- --check
      - name: CSS and JS bundles match their sources
        run: npm ci && npm run build && git diff --exit-code assets/css assets/js
      - name: Site rules
        run: python3 scripts/check-site.py
      - name: PostHog tiles match PostHog's own schema
        run: pip install --quiet pydantic certifi hogql-parser && python3 scripts/check-posthog-tiles.py
      - name: On-page SEO rules, valid HTML and no broken internal links
        run: npm run seo:check
